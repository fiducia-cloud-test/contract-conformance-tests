name: durable object RPC fencing admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Prove typed lease RPC and monotonic fencing
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          let fencing = 0;
          let lease = null;
          const acquire = ({resource, holder, request_id, ttl_ms}) => {
            assert.match(resource, /^[a-z0-9:_-]+$/);
            assert.match(holder, /^[a-z0-9:_-]+$/);
            assert.ok(request_id);
            if (!(ttl_ms >= 1000 && ttl_ms <= 300000)) throw new Error('invalid_ttl');
            if (lease && lease.holder !== holder) throw new Error('lease_held');
            if (!lease) lease = { resource, holder, request_id, fencing_token: ++fencing, ttl_ms };
            return lease;
          };
          const release = ({holder, fencing_token}) => {
            if (!lease || lease.holder !== holder || lease.fencing_token !== fencing_token) throw new Error('stale_fence');
            lease = null;
          };
          const first = acquire({resource:'job:42', holder:'node:a', request_id:'req-1', ttl_ms:5000});
          assert.equal(first.fencing_token, 1);
          assert.equal(acquire({resource:'job:42', holder:'node:a', request_id:'req-1', ttl_ms:5000}).fencing_token, 1);
          assert.throws(() => acquire({resource:'job:42', holder:'node:b', request_id:'req-2', ttl_ms:5000}), /lease_held/);
          release({holder:'node:a', fencing_token:1});
          const second = acquire({resource:'job:42', holder:'node:b', request_id:'req-2', ttl_ms:5000});
          assert.equal(second.fencing_token, 2);
          assert.throws(() => release({holder:'node:a', fencing_token:1}), /stale_fence/);
          NODE