name: Fiducia lease peer-authority convergence

on:
  pull_request:
    paths:
      - 'contracts/lease-policy/**'
      - '.github/workflows/peer-authority-convergence.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/lease-policy/**'
      - '.github/workflows/peer-authority-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority:
    uses: flags-2-env-test/contract-conformance-tests/.github/workflows/peer-authority-convergence.yml@7756eb9b08ec4909c4acb8ed3cef59f4280028bd
    with:
      typespec_path: contracts/lease-policy/main.tsp
      schema_path: contracts/lease-policy/authored.schema.json
      instances_path: contracts/lease-policy/instances
      expected_declarations_json: '["FiduciaLeasePolicy.LeasePolicyV1"]'
